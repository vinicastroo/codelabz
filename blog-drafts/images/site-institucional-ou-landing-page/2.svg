<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Fluxograma de decisão entre landing page e site institucional</title>
<desc id="d">Fluxograma simples de decisão: a pergunta 'existe uma oferta com prazo definido?' leva a 'Landing Page' quando a resposta é sim, ou a 'Site Institucional' quando a resposta é não.</desc>
<rect width="800" height="480" fill="#eef2f7"/>
<path d="M400 55.0 L530.0 100 L400 145.0 L270.0 100 Z" fill="#ffffff" stroke="#021d3f" stroke-width="2"/><text x="400" y="105" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#021d3f" text-anchor="middle">Existe uma oferta com prazo definido?</text><line x1="280" y1="100" x2="170" y2="220" stroke="#cfd9e6" stroke-width="2" stroke-linecap="round"/><text x="220" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#7d90a6" text-anchor="start">Sim</text><rect x="60" y="220" width="220" height="60" rx="10" fill="#f6cbd8" stroke="#e0024d" stroke-width="1.5"/><text x="170" y="256" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#021d3f" text-anchor="middle">Landing Page</text><line x1="520" y1="100" x2="630" y2="220" stroke="#cfd9e6" stroke-width="2" stroke-linecap="round"/><text x="590" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#7d90a6" text-anchor="start">Não</text><rect x="520" y="220" width="220" height="60" rx="10" fill="#e4ecf6" stroke="#0a3164" stroke-width="1.5"/><text x="630" y="256" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#021d3f" text-anchor="middle">Site Institucional</text>
</svg>